services:
  - type: web
    name: hca-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hca-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: LLM_PROVIDER
        value: mock
      - key: NODE_ENV
        value: production

databases:
  - name: hca-db
    plan: free
